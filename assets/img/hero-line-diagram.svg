<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" fill="none" role="img" aria-labelledby="heroDiagramTitle heroDiagramDesc">
  <title id="heroDiagramTitle">Schemat linii do sleevowania</title>
  <desc id="heroDiagramDesc">Aplikator rkawa, tunel obkurczajcy i transporter w ukBadzie liniowym</desc>

  <!-- TBo -->
  <rect width="720" height="420" fill="#f7f9fb"/>

  <!-- Linia transportowa -->
  <line x1="48" y1="210" x2="672" y2="210" stroke="#c8cdd4" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- StrzaBki przepBywu -->
  <path d="M300 210 L318 210" stroke="#0066cc" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M520 210 L538 210" stroke="#0066cc" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0066cc"/>
    </marker>
  </defs>

  <!-- 1. Aplikator rkawa -->
  <g id="applicator">
